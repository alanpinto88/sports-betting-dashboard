name: Verify Odds API secret presence (no API requests)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability without exposing its value
        env:
          ODDS_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ODDS_KEY" ]; then
            echo "::error::THE_ODDS_API_KEY is unavailable to this workflow"
            exit 1
          fi
          echo "PASS: THE_ODDS_API_KEY is available to GitHub Actions."
          echo "No upstream API request was made. Key validity and quota remain unverified."
