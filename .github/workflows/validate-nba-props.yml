name: Validate NBA prop comparisons
on:
  push:
    paths:
      - 'lib/validate-prop-comparison.mjs'
      - 'lib/validate-prop-comparison.test.mjs'
      - 'src/nba-prop-quote-validation.mjs'
      - 'src/nba-prop-quote-validation.test.mjs'
      - '.github/workflows/validate-nba-props.yml'
  pull_request:
    paths:
      - 'lib/validate-prop-comparison.mjs'
      - 'lib/validate-prop-comparison.test.mjs'
      - '.github/workflows/validate-nba-props.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed quote matching
        run: node --test lib/validate-prop-comparison.test.mjs src/nba-prop-quote-validation.test.mjs
