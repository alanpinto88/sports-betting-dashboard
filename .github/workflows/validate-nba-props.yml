name: Validate NBA prop comparisons
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/validate-prop-comparison.mjs'
      - 'lib/validate-prop-comparison.test.mjs'
      - 'src/nba-prop-quote-validation.mjs'
      - 'src/nba-prop-quote-validation.test.mjs'
      - 'src/nba-prop-research-normalizer.mjs'
      - 'src/nba-prop-research-normalizer.test.mjs'
      - 'src/nba-prop-research-groups.mjs'
      - 'src/nba-prop-research-groups.test.mjs'
      - 'src/nba-prop-research-freshness.mjs'
      - 'src/nba-prop-research-freshness.test.mjs'
      - 'src/nba-prop-historical-movement.mjs'
      - 'src/nba-prop-historical-movement.test.mjs'
      - 'src/nba-prop-saved-movement.mjs'
      - 'src/nba-prop-saved-movement.test.mjs'
      - '.github/workflows/validate-nba-props.yml'
      - 'nba-props.html'
      - 'src/nba-prop-dashboard-wiring.test.mjs'
  pull_request:
    paths:
      - 'lib/validate-prop-comparison.mjs'
      - 'lib/validate-prop-comparison.test.mjs'
      - 'src/nba-prop-quote-validation.mjs'
      - 'src/nba-prop-quote-validation.test.mjs'
      - 'src/nba-prop-research-normalizer.mjs'
      - 'src/nba-prop-research-normalizer.test.mjs'
      - 'src/nba-prop-research-groups.mjs'
      - 'src/nba-prop-research-groups.test.mjs'
      - 'src/nba-prop-research-freshness.mjs'
      - 'src/nba-prop-research-freshness.test.mjs'
      - 'src/nba-prop-historical-movement.mjs'
      - 'src/nba-prop-historical-movement.test.mjs'
      - 'src/nba-prop-saved-movement.mjs'
      - 'src/nba-prop-saved-movement.test.mjs'
      - '.github/workflows/validate-nba-props.yml'
      - 'nba-props.html'
      - 'src/nba-prop-dashboard-wiring.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed quote matching
        run: node --test lib/validate-prop-comparison.test.mjs src/nba-prop-quote-validation.test.mjs src/nba-prop-research-normalizer.test.mjs src/nba-prop-research-groups.test.mjs src/nba-prop-research-freshness.test.mjs src/nba-prop-historical-movement.test.mjs src/nba-prop-saved-movement.test.mjs src/nba-prop-dashboard-wiring.test.mjs
