name: NBA Prop Validation
on:
  push:
    paths:
      - 'lib/nba-prop-validation.mjs'
      - 'lib/nba-published-adapter.mjs'
      - 'tests/nba-published-adapter.test.mjs'
      - 'tests/nba-prop-validation.test.mjs'
      - '.github/workflows/nba-prop-validation.yml'
  pull_request:
    paths:
      - 'lib/nba-prop-validation.mjs'
      - 'lib/nba-published-adapter.mjs'
      - 'tests/nba-published-adapter.test.mjs'
      - 'tests/nba-prop-validation.test.mjs'
      - '.github/workflows/nba-prop-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run NBA prop validation regression tests
        run: node --test tests/nba-prop-validation.test.mjs tests/nba-published-adapter.test.mjs
