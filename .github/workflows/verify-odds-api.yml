name: Verify Odds API connection (one request, no odds markets)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate provider and read quota headers
        env:
          ODDS_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json,sys
          key=os.environ.get("ODDS_KEY","")
          if not key:
              print("FAIL: GitHub secret unavailable");sys.exit(1)
          # Exactly one request to the sports catalog; no event odds or historical endpoint.
          # The provider documents this catalog as zero quota cost.
          req=urllib.request.Request("https://api.the-odds-api.com/v4/sports/?apiKey="+key,headers={"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=15) as resp:
                  status=resp.status
                  headers=resp.headers
                  payload=json.load(resp)
          except urllib.error.HTTPError as e:
              print("FAIL: Provider HTTP status",e.code)
              sys.exit(1)
          except Exception as e:
              print("FAIL: Provider connection error",type(e).__name__)
              sys.exit(1)
          if status!=200 or not isinstance(payload,list):
              print("FAIL: Unexpected provider response");sys.exit(1)
          print("PASS: The Odds API accepted the secret; sports catalog received.")
          print("Available sports:",len(payload))
          for name,header in (("Requests remaining","x-requests-remaining"),("Requests used","x-requests-used"),("Last request cost","x-requests-last")):
              value=headers.get(header)
              print(name+":",value if value is not None else "not supplied")
          print("No API key or response payload printed; no odds markets requested.")
          PY
