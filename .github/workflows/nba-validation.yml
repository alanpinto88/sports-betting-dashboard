name: NBA quote integrity tests
on:
  push:
    paths:
      - 'lib/nba-quote-validation.mjs'
      - 'lib/nba-identity-review.mjs'
      - 'lib/nba-schedule-reconciliation.mjs'
      - 'lib/nba-roster-reconciliation.mjs'
      - 'lib/nba-boxscore-reconciliation.mjs'
      - 'lib/nba-player-game-stats.mjs'
      - 'lib/nba-player-history.mjs'
      - 'lib/nba-history-collector.mjs'
      - 'lib/nba-research-report.mjs'
      - 'lib/nba-historical-odds.mjs'
      - 'lib/nba-local-backup.mjs'
      - 'lib/nba-snapshot-coverage.mjs'
      - 'lib/nba-market-csv.mjs'
      - 'lib/nba-observed-changes.mjs'
      - 'lib/nba-changes-csv.mjs'
      - 'scripts/audit-nba-snapshot.mjs'
      - 'scripts/check-published-nba-snapshot.mjs'
      - 'data/nba-player-props-latest.json'
      - 'scripts/check-nba-page-modules.mjs'
      - 'nba-historical-odds.html'
      - 'nba-props.html'
      - 'nba-audit.html'
      - 'tests/*.test.mjs'
      - 'research/nba-quote-validation.mjs'
      - 'research/nba-quote-validation.test.mjs'
      - '.github/workflows/nba-validation.yml'
  pull_request:
    paths:
      - 'lib/nba-quote-validation.mjs'
      - 'lib/nba-identity-review.mjs'
      - 'lib/nba-schedule-reconciliation.mjs'
      - 'lib/nba-roster-reconciliation.mjs'
      - 'lib/nba-boxscore-reconciliation.mjs'
      - 'lib/nba-player-game-stats.mjs'
      - 'lib/nba-player-history.mjs'
      - 'lib/nba-history-collector.mjs'
      - 'lib/nba-research-report.mjs'
      - 'lib/nba-historical-odds.mjs'
      - 'lib/nba-local-backup.mjs'
      - 'lib/nba-snapshot-coverage.mjs'
      - 'lib/nba-market-csv.mjs'
      - 'lib/nba-observed-changes.mjs'
      - 'lib/nba-changes-csv.mjs'
      - 'scripts/audit-nba-snapshot.mjs'
      - 'scripts/check-published-nba-snapshot.mjs'
      - 'data/nba-player-props-latest.json'
      - 'scripts/check-nba-page-modules.mjs'
      - 'nba-historical-odds.html'
      - 'nba-props.html'
      - 'nba-audit.html'
      - 'tests/*.test.mjs'
      - 'research/nba-quote-validation.mjs'
      - 'research/nba-quote-validation.test.mjs'
      - '.github/workflows/nba-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate NBA quote and snapshot audit fixtures
        run: node --test tests/*.test.mjs
      - name: Audit published NBA snapshot offline
        run: node scripts/check-published-nba-snapshot.mjs
      - name: Check inline NBA page JavaScript syntax
        run: node scripts/check-nba-page-modules.mjs

      - name: Validate research NBA quote guards
        run: node --test research/nba-quote-validation.test.mjs
