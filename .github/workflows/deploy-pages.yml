name: Deploy Public Dashboard

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'lib/**'
      - 'src/**'
      - 'public-signals.json'
      - 'recent-market-review.json'
      - 'nba-player-props-review.json'
      - 'data/nba-player-props-*.json'
      - 'data/nba-*.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture NBA player points (one event, quota-controlled)']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('github-pages-skipped-{0}', github.run_id) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A capture can push a newer commit than the one it started from.
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.sha }}
          persist-credentials: false

      - name: Validate public website files
        run: |
          test -f index.html
          test -f signals.html
          test -f scanner.html
          test -f research.html
          test -f props.html
          python -m json.tool public-signals.json >/dev/null
          if grep -R -E 'THE_ODDS_API_KEY|ghp_[A-Za-z0-9]+|github_pat_' --include='*.html' --include='*.json' .; then
            echo "Possible credential in public files"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate NBA research before deployment
        run: |
          node --test tests/*.test.mjs
          node --test lib/validate-prop-comparison.test.mjs src/nba-prop-*.test.mjs research/nba-quote-validation.test.mjs
          node scripts/check-published-nba-snapshot.mjs
          node scripts/check-nba-page-modules.mjs

      - uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
