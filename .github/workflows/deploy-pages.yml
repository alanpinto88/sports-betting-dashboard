name: Deploy Public Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'signals.html'
      - 'public-signals.json'
      - 'recent-market-review.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public website files
        run: |
          test -f index.html
          test -f signals.html
          python -m json.tool public-signals.json >/dev/null
          if grep -R -E 'THE_ODDS_API_KEY|ghp_[A-Za-z0-9]+|github_pat_' --include='*.html' --include='*.json' .; then
            echo "Possible credential in public files"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
