name: Capture NHL odds (manual, quota-controlled)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/odds-capture-trigger.txt'
permissions:
  contents: write
concurrency:
  group: nhl-odds-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one NHL odds snapshot
        env:
          ODDS_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime,sys,pathlib
          key=os.getenv("ODDS_KEY")
          if not key:
              sys.exit("Missing GitHub secret THE_ODDS_API_KEY")
          # Exactly one provider request; no historical or player prop endpoints.
          url="https://api.the-odds-api.com/v4/sports/icehockey_nhl/odds/?regions=us&markets=h2h,totals&oddsFormat=american&apiKey="+key
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"Accept":"application/json"}),timeout=20) as r:
                  data=json.load(r); h=r.headers
          except urllib.error.HTTPError as e:
              sys.exit("Provider HTTP "+str(e.code))
          if not isinstance(data,list):
              sys.exit("Unexpected provider response")
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          result={"source":"The Odds API","sport":"icehockey_nhl","captured_at":stamp,
                  "markets_requested":["h2h","totals"],"events":data,
                  "quota":{"remaining":h.get("x-requests-remaining"),
                           "used":h.get("x-requests-used"),"last_cost":h.get("x-requests-last")}}
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/nhl-odds-latest.json").write_text(json.dumps(result,separators=(",",":")))
          print("NHL events:",len(data))
          print("Remaining quota:",result["quota"]["remaining"])
          print("Last request cost:",result["quota"]["last_cost"])
          print("API key not printed.")
          PY
      - name: Publish snapshot only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhl-odds-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: capture verified NHL odds snapshot"
          git push
