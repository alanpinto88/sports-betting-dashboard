name: Capture NBA player points (one event, quota-controlled)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/nba-props-trigger.txt'
permissions:
  contents: write
concurrency:
  group: nba-props-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exactly one NBA event's points props
        env:
          ODDS_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,datetime,pathlib,sys
          key=os.getenv("ODDS_KEY")
          if not key: sys.exit("Missing secret THE_ODDS_API_KEY")
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r),r.headers
          # Event listing is a non-odds catalog request; avoid paying for all NBA player markets.
          base="https://api.the-odds-api.com/v4/sports/basketball_nba/events"
          try: events,headers=get(base+"?"+urllib.parse.urlencode({"apiKey":key}))
          except urllib.error.HTTPError as e: sys.exit("Event catalog HTTP "+str(e.code))
          if not isinstance(events,list): sys.exit("Unexpected event catalog")
          now=datetime.datetime.now(datetime.timezone.utc)
          upcoming=sorted((e for e in events if e.get("id") and e.get("commence_time") and datetime.datetime.fromisoformat(e["commence_time"].replace("Z","+00:00"))>now),key=lambda e:e["commence_time"])
          if not upcoming:
              print("No upcoming NBA events; no player prop request made");sys.exit(0)
          remaining=headers.get("x-requests-remaining")
          if remaining is None or not remaining.isdigit():
              sys.exit("Quota unavailable; no odds request made")
          if int(remaining)<=100:
              sys.exit("Quota at or below safety floor; no odds request made")
          event=upcoming[0]
          params=urllib.parse.urlencode({"apiKey":key,"regions":"us","markets":"player_points","oddsFormat":"american"})
          url="https://api.the-odds-api.com/v4/sports/basketball_nba/events/"+urllib.parse.quote(event["id"],safe="")+"/odds?"+params
          try: result,h=get(url)
          except urllib.error.HTTPError as e: sys.exit("Player prop endpoint HTTP "+str(e.code)+"; no secret printed")
          if not isinstance(result,dict) or not result.get("id"):sys.exit("Unexpected odds response")
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          data={"source":"The Odds API","sport":"basketball_nba","captured_at":stamp,"markets_requested":["player_points"],"region":"us","events":[result],"quota_remaining_at_end":h.get("x-requests-remaining"),"last_request_cost":h.get("x-requests-last"),"refresh_mode":"manual one-event snapshot"}
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/nba-player-props-latest.json").write_text(json.dumps(data,separators=(",",":")))
          print("NBA event:",event.get("home_team"),"vs",event.get("away_team"))
          print("Books:",len(result.get("bookmakers",[])),"remaining:",data["quota_remaining_at_end"],"last cost:",data["last_request_cost"])
          print("No API key printed.")
          PY
      - name: Publish snapshot
        run: |
          if [ ! -f data/nba-player-props-latest.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-player-props-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: capture one NBA player points event"
          git push
